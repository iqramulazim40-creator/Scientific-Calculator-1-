
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">

    <div class="w-full max-w-sm bg-white rounded-2xl shadow-xl p-4">

       <h1 class="text-xl font-bold text-center text-blue-700 mb-3">
            Scientific Calculator
        </h1>

        <input
            type="text"
            id="display"
            value="0"
            readonly
            class="w-full bg-slate-900 text-white text-right text-2xl p-2 rounded-lg mb-3"
        >

        <div class="grid grid-cols-4 gap-3">

            <button onclick="clearDisplay()" class="bg-red-500 text-white p-3 rounded-lg font-bold">C</button>
            <button onclick="deleteLast()" class="bg-slate-300 p-3 rounded-lg font-bold">DEL</button>
            <button onclick="appendValue('(')" class="bg-slate-200 p-3 rounded-lg">(</button>
            <button onclick="appendValue(')')" class="bg-slate-200 p-3 rounded-lg">)</button>

            <button onclick="appendValue('sin(')" class="bg-blue-100 text-blue-800 p-3 rounded-lg">sin</button>
            <button onclick="appendValue('cos(')" class="bg-blue-100 text-blue-800 p-3 rounded-lg">cos</button>
            <button onclick="appendValue('tan(')" class="bg-blue-100 text-blue-800 p-3 rounded-lg">tan</button>
            <button onclick="appendValue('sqrt(')" class="bg-blue-100 text-blue-800 p-3 rounded-lg">√</button>

            <button onclick="appendValue('log(')" class="bg-blue-100 text-blue-800 p-3 rounded-lg">log</button>
            <button onclick="appendValue('ln(')" class="bg-blue-100 text-blue-800 p-3 rounded-lg">ln</button>
            <button onclick="appendValue('^2')" class="bg-blue-100 text-blue-800 p-3 rounded-lg">x²</button>
            <button onclick="appendValue('^')" class="bg-blue-100 text-blue-800 p-3 rounded-lg">xʸ</button>

            <button onclick="appendValue('7')" class="bg-slate-100 p-3 rounded-lg text-lg">7</button>
            <button onclick="appendValue('8')" class="bg-slate-100 p-3 rounded-lg text-lg">8</button>
            <button onclick="appendValue('9')" class="bg-slate-100 p-3 rounded-lg text-lg">9</button>
            <button onclick="appendValue('/')" class="bg-amber-200 p-3 rounded-lg text-lg">÷</button>

            <button onclick="appendValue('4')" class="bg-slate-100 p-3 rounded-lg text-lg">4</button>
            <button onclick="appendValue('5')" class="bg-slate-100 p-3 rounded-lg text-lg">5</button>
            <button onclick="appendValue('6')" class="bg-slate-100 p-3 rounded-lg text-lg">6</button>
            <button onclick="appendValue('*')" class="bg-amber-200 p-3 rounded-lg text-lg">×</button>

            <button onclick="appendValue('1')" class="bg-slate-100 p-3 rounded-lg text-lg">1</button>
            <button onclick="appendValue('2')" class="bg-slate-100 p-3 rounded-lg text-lg">2</button>
            <button onclick="appendValue('3')" class="bg-slate-100 p-3 rounded-lg text-lg">3</button>
            <button onclick="appendValue('-')" class="bg-amber-200 p-3 rounded-lg text-lg">−</button>

            <button onclick="appendValue('0')" class="bg-slate-100 p-3 rounded-lg text-lg">0</button>
            <button onclick="appendValue('.')" class="bg-slate-100 p-3 rounded-lg text-lg">.</button>
            <button onclick="appendValue('+')" class="bg-amber-200 p-3 rounded-lg text-lg">+</button>
            <button onclick="calculate()" class="bg-blue-600 text-white p-3 rounded-lg font-bold">=</button>

            <button onclick="appendValue('pi')" class="col-span-2 bg-purple-100 text-purple-800 p-3 rounded-lg">π</button>
            <button onclick="appendValue('e')" class="col-span-2 bg-purple-100 text-purple-800 p-3 rounded-lg">e</button>

        </div>

        <p class="text-sm text-slate-500 text-center mt-4">
            Trigonometric functions use degrees.
        </p>

    </div>

    <script src="Scientific Calculator script.js"></script>
</body>
</html>
